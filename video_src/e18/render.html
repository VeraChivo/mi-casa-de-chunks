<!doctype html>
<html><head><meta charset="utf-8"><title>E18 render（我的家人與朋友）</title>
<style>html,body{margin:0;background:#222}canvas{display:block;width:432px;height:540px}</style></head><body>
<canvas id="c"></canvas>
<script src="timeline.js"></script><script src="../lib/nita.js"></script><script src="../lib/family.js"></script><script src="../lib/scene.js"></script>
<script>
const {W,H}=TL; const cv=document.getElementById('c'); cv.width=W; cv.height=H; const ctx=cv.getContext('2d');
const FONT='"Liberation Sans","DejaVu Sans",sans-serif', GY=1180;
const E01=x=>x<0?0:x>1?1:x, ease=p=>{p=E01(p);return p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;};
const pop=p=>{p=E01(p);const c=1.7;return 1+(c+1)*Math.pow(p-1,3)+c*Math.pow(p-1,2);};
const lerp=(a,b,p)=>a+(b-a)*p, camLerp=(a,b,p)=>[lerp(a[0],b[0],p),lerp(a[1],b[1],p),lerp(a[2],b[2],p)];
// 共用狀態：呼吸、眨眼、講話時嘴巴開合（talker＝這一幕誰在說話）
function st(t,sc,extra={},talk=false,k=0){ const o=Object.assign({x:540,y:GY,s:1,expr:'smile',tail:Math.sin(t*2+k)*0.12,headTilt:Math.sin(t*1.3+k)*0.02},extra);
  o.y+=Math.sin(t*2.4+k)*2.5; const rest=o.expr;
  if(talk && t>=sc.voice && t<sc.voiceEnd) o.expr=(Math.floor((t-sc.voice)/0.15)%2===0)?'talk':rest;
  else if(((t+k*0.9+sc.idx*0.7)%3.1)<0.12 && rest!=='soft') o.expr='blink'; return o; }
function nita(t,sc,extra={}){ const o=st(t,sc,Object.assign({expr:'aloof',x:820},extra)); return o; }
function fam(id,o){ FAMILY.draw(ctx,id,o); }
const slide=(t,sc,from,to,dur=0.55)=>lerp(from,to,ease((t-sc.start)/dur));
function tag(x,y,text,t0,t){ const s=pop((t-t0)/0.3); if(s<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(s,s);
  ctx.font=`800 46px ${FONT}`; const w=ctx.measureText(text).width+60; ctx.fillStyle='#FFFDF8'; ctx.beginPath(); ctx.roundRect(-w/2,-36,w,72,36); ctx.fill();
  ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle='#4A3168'; ctx.fillText(text,0,3); ctx.restore(); }
function steam(x,y,t){ ctx.save(); ctx.strokeStyle='rgba(150,130,110,.55)'; ctx.lineWidth=7; ctx.lineCap='round';
  [0,34,68].forEach((dx,i)=>{ const ph=t*3+i*1.7, h=60; ctx.beginPath(); ctx.moveTo(x+dx,y); ctx.quadraticCurveTo(x+dx-14+Math.sin(ph)*8,y-h/2,x+dx,y-h); ctx.quadraticCurveTo(x+dx+14+Math.sin(ph)*8,y-h*1.5,x+dx,y-h*2); ctx.stroke(); }); ctx.restore(); }
// 開場：家庭樹（爸媽在上、四個孩子在下，連線一條條長出來；妮妲有金色外圈）
function headIn(id,x,y,R,t0,t,ring){ const p=pop((t-t0)/0.35); if(p<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(p,p);
  ctx.fillStyle='#FFFFFF'; ctx.beginPath(); ctx.arc(0,0,R,0,7); ctx.fill(); ctx.save(); ctx.beginPath(); ctx.arc(0,0,R,0,7); ctx.clip();
  ctx.fillStyle=id==='nita'?'#E3D8F5':'#E9E0F7'; ctx.fillRect(-R,-R,2*R,2*R); ctx.scale(R/58,R/58);
  if(id==='nita') NITA.draw(ctx,{x:0,y:112-4,s:0.27,expr:'aloof',headOnly:true}); else { const sp=FAMILY.spec[id]; FAMILY.draw(ctx,id,{x:0,y:112,s:0.28/sp.scale,expr:'smile',headOnly:true}); }
  ctx.restore();
  if(ring){ ctx.strokeStyle='#7A55A8'; ctx.lineWidth=8; ctx.beginPath(); ctx.arc(0,0,R-2,0,7); ctx.stroke();
    ctx.save(); ctx.translate(R*0.72,-R*0.72); ctx.fillStyle='#E8C766'; ctx.beginPath(); for(let k=0;k<10;k++){ const a=-Math.PI/2+k*Math.PI/5, r=k%2?11:26; ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r); } ctx.closePath(); ctx.fill(); ctx.restore(); }
  ctx.restore(); }
function treeLine(x1,y1,x2,y2,t0,t){ const p=E01((t-t0)/0.3); if(p<=0) return; ctx.save(); ctx.strokeStyle='#B79BE0'; ctx.lineWidth=9; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x1+(x2-x1)*p,y1+(y2-y1)*p); ctx.stroke(); ctx.restore(); }
function treeLabel(x,y,text,t0,t){ const p=E01((t-t0)/0.25); if(p<=0) return; ctx.save(); ctx.globalAlpha=p; ctx.font=`800 38px ${FONT}`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle='#4A3168'; ctx.fillText(text,x,y); ctx.restore(); }
function familyTree(t,t0){
  ctx.save(); ctx.fillStyle='#F7F2FD'; ctx.beginPath(); ctx.roundRect(50,130,980,900,56); ctx.fill(); ctx.restore();
  const PY=330, KY=720, R=108, kids=[['kito',190,'Kito'],['nita',405,'Nita'],['tito',640,'Tito'],['mimi',860,'Mimi']];
  treeLine(330,PY,750,PY,t0+0.25,t); const h=pop((t-t0-0.45)/0.3); if(h>0){ ctx.save(); ctx.translate(540,PY); ctx.scale(h,h); ctx.font='64px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle='#E8869B'; ctx.fillText('♥',0,0); ctx.restore(); }
  treeLine(540,PY+34,540,520,t0+0.6,t); treeLine(190,520,860,520,t0+0.7,t); kids.forEach(([id,x],i)=>treeLine(x,520,x,KY-R,t0+0.8+i*0.08,t));
  headIn('dad',330,PY,R,t0,t); headIn('mom',750,PY,R,t0+0.1,t); treeLabel(330,PY+R+42,'Papá',t0+0.3,t); treeLabel(750,PY+R+42,'Mamá',t0+0.4,t);
  kids.forEach(([id,x,nm],i)=>{ headIn(id,x,KY,R,t0+0.9+i*0.15,t,id==='nita'); treeLabel(x,KY+R+42,nm,t0+1.1+i*0.15,t); }); }
// 數人頭：數字一個個彈出
function counting(list,t,t0){ list.forEach(([x,y],i)=>{ const p=pop((t-t0-i*0.22)/0.3); if(p<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(p,p);
  ctx.fillStyle='#E8C766'; ctx.beginPath(); ctx.arc(0,0,38,0,7); ctx.fill(); ctx.font=`900 44px ${FONT}`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle='#4A3168'; ctx.fillText(String(i+1),0,3); ctx.restore(); }); }
const pos10={dad:-50,kito:220,nita:450,vera:690,mom:945,tito:1145,mimi:1280};
const GX=[['dad',90],['kito',330],['nita',560],['mom',790],['tito',990],['mimi',1130]];
const HEADY={dad:GY-690,kito:GY-640,nita:GY-640,mom:GY-610,tito:GY-440,mimi:GY-340};
function GROUP(t,sc,cook){ const list=[]; let n;
  GX.forEach(([id,x],i)=>{ if(id==='nita'){ n=nita(t,sc,{x,expr:'soft'}); return; }
    const o=st(t,sc,{x,expr:'smile',pose:id==='dad'&&cook?'cook':(id==='tito'||id==='mimi')?'hold':'stand',look:id==='kito'?1:0},id==='dad'&&cook&&t>=sc.voice,i); if(id==='mimi'&&t>sc.voice) o.y-=Math.abs(Math.sin(t*4))*6; list.push([id,o]); });
  return {n,list}; }
const SHOTS=[
 // 1 Tengo una familia.：家庭樹（全螢幕卡片，蓋在房間上）
 (t,sc)=>({cam:[0.9,540,830], overlay:()=>familyTree(t,sc.voice+0.05)}),
 // 2 Mamá Cata：媽媽走進來，摸妮妲的頭
 (t,sc)=>{ const mx=slide(t,sc,-120,520,0.7); const m=st(t,sc,{x:mx,expr:'smile',headTilt:0.05*Math.sin(t*3)},true,1);
   const n=nita(t,sc,{x:840,expr:'side',look:-1});
   return {cam:camLerp([0.95,600,800],[1.05,640,800],ease((t-sc.start)/2.5)), nita:n, order:[['mom',m]], world:()=>tag(mx,GY-640,'Mamá Cata',sc.voice,t)}; },
 // 3 Papá Tato：爸爸（修東西）螺絲起子，口袋工具
 (t,sc)=>{ const dx=slide(t,sc,-200,470,0.7); const d=st(t,sc,{x:dx,expr:'smile',pose:t>sc.voice?'repair':'stand'},true,2); if(t>sc.voice) d.y-=Math.abs(Math.sin((t-sc.voice)*4))*8;
   const n=nita(t,sc,{x:870,expr:'side',look:-1});
   return {cam:camLerp([0.9,620,780],[1.0,650,790],ease((t-sc.start)/2.7)), nita:n, order:[['dad',d]], world:()=>tag(dx,GY-690,'Papá Tato',sc.voice,t)}; },
 // 4 Kito：單獨近鏡，眼神飄開、小聲揮手
 (t,sc)=>{ const k=st(t,sc,{x:540,expr:'smile',look:1,headTilt:0.05*Math.sin(t*3)},true,3);
   return {cam:camLerp([1.35,540,900],[1.5,540,880],ease((t-sc.start)/(sc.end-sc.start))), order:[['kito',k]], world:()=>tag(540,GY-640,'Kito',sc.voice,t)}; },
 // 5 hermano mayor：哥哥走到妮妲旁，手搭肩（兩人靠近）
 (t,sc)=>{ const kx=slide(t,sc,330,470,1.0); const k=st(t,sc,{x:kx,expr:'smile',look:1,headTilt:-0.06*ease((t-sc.voice)/0.4)},true,3);
   const n=nita(t,sc,{x:700,expr:'side',look:-1,headTilt:0.05*ease((t-sc.voice)/0.4)});
   return {cam:camLerp([1.1,590,830],[1.2,590,830],ease((t-sc.start)/2.5)), nita:n, order:[['kito',k]]}; },
 // 6 Tito：抱小紅車跑進來
 (t,sc)=>{ const tx=slide(t,sc,-150,540,0.6); const ti=st(t,sc,{x:tx,expr:'smile',pose:'hold',headTilt:0.04*Math.sin(t*3)},true,4); if(t<sc.start+0.7) ti.y-=Math.abs(Math.sin((t-sc.start)*9))*14;
   return {cam:camLerp([1.35,540,930],[1.45,540,930],ease((t-sc.start)/2.5)), order:[['tito',ti]], world:()=>tag(tx,GY-430,'Tito',sc.voice,t)}; },
 // 7 Mimi：抱兔耳骷髏蹦跳到鏡頭前，妮妲彎腰看
 (t,sc)=>{ const mx=slide(t,sc,150,470,0.6); const m=st(t,sc,{x:mx,expr:'smile',pose:'hold'},true,5); m.y-=Math.abs(Math.sin((t-sc.start)*5))*(t<sc.voiceEnd?18:4);
   const n=nita(t,sc,{x:820,expr:'soft',headTilt:0.16*ease((t-sc.voice)/0.5),look:-1});
   return {cam:camLerp([1.3,640,950],[1.4,640,950],ease((t-sc.start)/2.5)), nita:n, order:[['mimi',m]], world:()=>tag(mx,GY-340,'Mimi',sc.voice,t)}; },
 // 8 Yo soy Nita, la hermana de Kito, Tito y Mimi.：妮妲在中間，三個手足依序在身邊彈出
 (t,sc)=>{ const n=nita(t,sc,{x:540,expr:'soft'}); n.s=1;
   const extra=[['kito',250,sc.voice+1.2],['tito',830,sc.voice+1.8],['mimi',1010,sc.voice+2.3]];
   const o=extra.map(([id,x,t0],i)=>[id,st(t,sc,{x:x,expr:'smile',pose:(id==='tito'||id==='mimi')?'hold':'stand',s:t<t0?0.001:Math.min(1,pop((t-t0)/0.35))*1},false,i)]);
   return {cam:camLerp([0.95,590,860],[0.85,590,830],ease((t-sc.start)/3)), nita:n, order:o}; },
 // 9 Somos seis en la familia.：全員站好，頭上的數字一個個數到六
 (t,sc)=>{ const o=GROUP(t,sc,false);
   return {cam:[0.7,620,790], nita:o.n, order:o.list, world:()=>counting(GX.map(([id,x])=>[x,HEADY[id]]),t,sc.voice+0.1)}; },
 // 10 Somos la familia de Nita.：爸爸（煮菜）香氣，全家看向鏡頭
 (t,sc)=>{ const o=GROUP(t,sc,true); return {cam:camLerp([0.7,620,790],[0.78,620,830],ease((t-sc.start)/3)), nita:o.n, order:o.list, world:()=>steam(GX[0][1]+120,GY-330,t)}; },
];
function subtitle(sc,t){ if(t<sc.voice-0.1) return; ctx.save(); ctx.globalAlpha=E01((t-(sc.voice-0.1))/0.15);
  ctx.font=`800 54px ${FONT}`; ctx.textAlign='left'; ctx.textBaseline='middle';
  const words=sc.es.split(' '),lines=[]; let cur=''; words.forEach(w=>{ const n=cur?cur+' '+w:w; if(ctx.measureText(n).width>880){lines.push(cur);cur=w;}else cur=n;}); lines.push(cur);
  const lh=70,h=lines.length*lh+44,y0=H-60-h; ctx.fillStyle='rgba(255,253,248,.95)'; ctx.beginPath(); ctx.roundRect(70,y0,W-140,h,32); ctx.fill();
  lines.forEach((ln,k)=>{ const y=y0+22+lh*k+lh/2,wl=ctx.measureText(ln).width,x0=W/2-wl/2,i=ln.indexOf(sc.key);
    if(i>=0){ const pre=ctx.measureText(ln.slice(0,i)).width,kw=ctx.measureText(sc.key).width; ctx.fillStyle='rgba(212,169,58,.38)'; ctx.beginPath(); ctx.roundRect(x0+pre-8,y-24,kw+16,50,12); ctx.fill(); }
    ctx.fillStyle='#3B3550'; ctx.fillText(ln,x0,y); }); ctx.restore(); }
function counter(i){ ctx.save(); ctx.fillStyle='rgba(255,253,248,.85)'; ctx.beginPath(); ctx.roundRect(40,40,150,62,31); ctx.fill(); ctx.font=`800 34px ${FONT}`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle='#7A55A8'; ctx.fillText(`${i+1} / 10`,115,72); ctx.restore(); }
function sceneAt(t){ for(let i=0;i<TL.scenes.length;i++) if(t<TL.scenes[i].end) return i; return TL.scenes.length-1; }
function render(frame){ const t=frame/TL.FPS_DRAW,i=sceneAt(t),sc=TL.scenes[i],shot=SHOTS[i](t,sc);
  ctx.fillStyle='#F3EADF'; ctx.fillRect(0,0,W,H);
  ctx.save(); SCENE.camera(ctx,...shot.cam); SCENE.room(ctx,shot.roomOpts||{});
  const items=[]; if(shot.nita) items.push(['nita',shot.nita]); (shot.order||[]).forEach(x=>items.push(x));
    items.sort((a,b)=>a[1].x-b[1].x||0);
  items.forEach(([id,s])=>{ if(id==='nita') NITA.draw(ctx,s); else fam(id,s); });
  if(shot.world) shot.world();
  ctx.restore(); if(shot.overlay) shot.overlay(); counter(i); subtitle(sc,t); }
window.render=render; window.renderToData=f=>{render(f);return cv.toDataURL('image/jpeg',.92);};
</script></body></html>
