<!doctype html>
<html><head><meta charset="utf-8"><title>E21 render（我的朋友薇拉）</title>
<style>html,body{margin:0;background:#222}canvas{display:block;width:432px;height:540px}</style></head><body>
<canvas id="c"></canvas>
<script src="timeline.js"></script><script src="../lib/nita.js"></script><script src="../lib/family.js"></script><script src="../lib/scene.js"></script>
<script>
const {W,H}=TL; const cv=document.getElementById('c'); cv.width=W; cv.height=H; const ctx=cv.getContext('2d');
const FONT='"Liberation Sans","DejaVu Sans",sans-serif', GY=1180;
const E01=x=>x<0?0:x>1?1:x, ease=p=>{p=E01(p);return p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;};
const pop=p=>{p=E01(p);const c=1.7;return 1+(c+1)*Math.pow(p-1,3)+c*Math.pow(p-1,2);};
const lerp=(a,b,p)=>a+(b-a)*p, camLerp=(a,b,p)=>[lerp(a[0],b[0],p),lerp(a[1],b[1],p),lerp(a[2],b[2],p)];
// 共用狀態：呼吸、眨眼、講話時嘴巴開合（talker＝這一幕誰在說話）
function st(t,sc,extra={},talk=false,k=0){ const o=Object.assign({x:540,y:GY,s:1,expr:'smile',tail:Math.sin(t*2+k)*0.12,headTilt:Math.sin(t*1.3+k)*0.02},extra);
  o.y+=Math.sin(t*2.4+k)*2.5; const rest=o.expr;
  if(talk && t>=sc.voice && t<sc.voiceEnd) o.expr=(Math.floor((t-sc.voice)/0.15)%2===0)?'talk':rest;
  else if(((t+k*0.9+sc.idx*0.7)%3.1)<0.12 && rest!=='soft') o.expr='blink'; return o; }
function nita(t,sc,extra={}){ const o=st(t,sc,Object.assign({expr:'aloof',x:820},extra),true,0); return o; }
function fam(id,o){ FAMILY.draw(ctx,id,o); }
const slide=(t,sc,from,to,dur=0.55)=>lerp(from,to,ease((t-sc.start)/dur));
const SHOTS=[
 // 1 Esta es mi amiga Vera.：妮妲站著，薇拉從左邊走進來，妮妲看向她
 (t,sc)=>{ const vx=slide(t,sc,-200,420,0.9); const v=st(t,sc,{x:vx,expr:'smile'},false,6); if(t<sc.start+1.0) v.y-=Math.abs(Math.sin((t-sc.start)*8))*10;
   const n=nita(t,sc,{x:760,expr:'side',look:-1,headTilt:0.05*ease((t-sc.voice+0.2)/0.4)});
   return {cam:camLerp([1.0,590,830],[1.1,590,830],ease((t-sc.start)/2.4)), nita:n, order:[['vera',v]]}; },
 // 2 Vera es una oveja.：薇拉近鏡，捲毛和彎角
 (t,sc)=>{ const v=st(t,sc,{x:540,expr:'smile',headTilt:0.06*Math.sin(t*3)},false,6);
   return {cam:camLerp([1.35,540,880],[1.5,540,860],ease((t-sc.start)/(sc.end-sc.start))), order:[['vera',v]]}; },
 // 3 Es blanca y suave.：妮妲伸手輕摸薇拉的捲毛
 (t,sc)=>{ const v=st(t,sc,{x:450,expr:'smile',headTilt:-0.05*ease((t-sc.voice)/0.5)},false,6);
   const n=nita(t,sc,{x:710,expr:'soft',look:-1,pose:t>sc.voice-0.1?'point':'stand',pointAng:lerp(-0.5,0.3,ease((t-sc.voice)/0.5)),headTilt:0.08*ease((t-sc.voice)/0.5)});
   return {cam:[1.2,600,830], nita:n, order:[['vera',v]]}; },
 // 4 Es muy divertida.：薇拉開心蹦跳
 (t,sc)=>{ const v=st(t,sc,{x:540,expr:'happy',headTilt:0.1*Math.sin(t*9)},false,6); if(t>sc.voice-0.1) v.y-=Math.abs(Math.sin((t-sc.voice)*7))*34;
   return {cam:[1.2,540,830], order:[['vera',v]]}; },
 // 5 También es amable con todos.：迪多和咪咪經過，薇拉朝他們揮手
 (t,sc)=>{ const tx=lerp(1300,-250,E01((t-sc.start)/(sc.end-sc.start))); const ti=st(t,sc,{x:tx,y:GY-90,s:0.8,z:-1,expr:'smile',pose:'hold'},false,4), mi=st(t,sc,{x:tx+210,y:GY-90,s:0.8,z:-1,expr:'smile',pose:'hold'},false,5); mi.y-=Math.abs(Math.sin(t*6))*8;
   const v=st(t,sc,{x:420,expr:'smile',look:1,headTilt:0.06*Math.sin(t*4)},false,6);
   return {cam:[0.95,620,860], order:[['vera',v],['tito',ti],['mimi',mi]]}; },
 // 6 Es muy lista.：薇拉眼睛一亮，抬頭
 (t,sc)=>{ const p=ease((t-sc.voice)/0.4); const v=st(t,sc,{x:540,expr:p>0.3?'happy':'smile',headTilt:-0.08*p,y:GY-8*p},false,6);
   return {cam:camLerp([1.35,540,880],[1.5,540,870],ease((t-sc.start)/(sc.end-sc.start))), order:[['vera',v]]}; },
 // 7 Es mi mejor amiga.：兩人並肩，妮妲眼神放鬆
 (t,sc)=>{ const v=st(t,sc,{x:440,expr:'smile',headTilt:-0.04*ease((t-sc.voice)/0.5)},false,6); const n=nita(t,sc,{x:680,expr:'soft',look:-1,headTilt:0.05*ease((t-sc.voice)/0.5)});
   return {cam:camLerp([1.1,560,830],[1.2,560,830],ease((t-sc.start)/2.0)), nita:n, order:[['vera',v]]}; },
 // 8 Ella es muy simpática y yo soy un poco tímida.：薇拉揮手，妮妲縮一點、看旁邊
 (t,sc)=>{ const v=st(t,sc,{x:760,expr:'smile',headTilt:0.08*Math.sin(t*5)},false,6);
   const shy=ease((t-(sc.voice+1.7))/0.5); const n=nita(t,sc,{x:360,expr:'side',look:1,headTilt:-0.07*shy,y:GY+10*shy,s:1-0.03*shy});
   return {cam:[1.0,560,840], nita:n, order:[['vera',v]]}; },
 // 9 Y somos buenas amigas.：兩人靠近
 (t,sc)=>{ const k=ease((t-sc.start)/0.9); const v=st(t,sc,{x:lerp(760,520,k),expr:'smile',headTilt:-0.05*k},false,6); const n=nita(t,sc,{x:lerp(360,700,k),expr:'soft',look:-1,headTilt:0.06*k});
   return {cam:camLerp([1.0,560,840],[1.2,610,830],ease((t-sc.start)/2.2)), nita:n, order:[['vera',v]]}; },
 // 10 Vera es mi amiga.：鏡頭拉遠，兩人在角落房間裡
 (t,sc)=>{ const v=st(t,sc,{x:500,expr:'smile'},false,6); const n=nita(t,sc,{x:700,expr:'soft',look:-1});
   return {cam:camLerp([1.2,610,830],[0.9,580,820],ease((t-sc.start)/2.2)), nita:n, order:[['vera',v]]}; },
];
function subtitle(sc,t){ if(t<sc.voice-0.1) return; ctx.save(); ctx.globalAlpha=E01((t-(sc.voice-0.1))/0.15);
  ctx.font=`800 54px ${FONT}`; ctx.textAlign='left'; ctx.textBaseline='middle';
  const words=sc.es.split(' '),lines=[]; let cur=''; words.forEach(w=>{ const n=cur?cur+' '+w:w; if(ctx.measureText(n).width>880){lines.push(cur);cur=w;}else cur=n;}); lines.push(cur);
  const lh=70,h=lines.length*lh+44,y0=H-60-h; ctx.fillStyle='rgba(255,253,248,.95)'; ctx.beginPath(); ctx.roundRect(70,y0,W-140,h,32); ctx.fill();
  lines.forEach((ln,k)=>{ const y=y0+22+lh*k+lh/2,wl=ctx.measureText(ln).width,x0=W/2-wl/2,i=ln.indexOf(sc.key);
    if(i>=0){ const pre=ctx.measureText(ln.slice(0,i)).width,kw=ctx.measureText(sc.key).width; ctx.fillStyle='rgba(212,169,58,.38)'; ctx.beginPath(); ctx.roundRect(x0+pre-8,y-24,kw+16,50,12); ctx.fill(); }
    ctx.fillStyle='#3B3550'; ctx.fillText(ln,x0,y); }); ctx.restore(); }
function counter(i){ ctx.save(); ctx.fillStyle='rgba(255,253,248,.85)'; ctx.beginPath(); ctx.roundRect(40,40,150,62,31); ctx.fill(); ctx.font=`800 34px ${FONT}`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle='#7A55A8'; ctx.fillText(`${i+1} / 10`,115,72); ctx.restore(); }
function sceneAt(t){ for(let i=0;i<TL.scenes.length;i++) if(t<TL.scenes[i].end) return i; return TL.scenes.length-1; }
function render(frame){ const t=frame/TL.FPS_DRAW,i=sceneAt(t),sc=TL.scenes[i],shot=SHOTS[i](t,sc);
  ctx.fillStyle='#F3EADF'; ctx.fillRect(0,0,W,H);
  ctx.save(); SCENE.camera(ctx,...shot.cam); SCENE.room(ctx,shot.roomOpts||{});
  const items=[]; if(shot.nita) items.push(['nita',shot.nita]); (shot.order||[]).forEach(x=>items.push(x));
    items.sort((a,b)=>((a[1].z||0)-(b[1].z||0))||(a[1].x-b[1].x));
  items.forEach(([id,s])=>{ if(id==='nita') NITA.draw(ctx,s); else fam(id,s); });
  if(shot.world) shot.world();
  ctx.restore(); if(shot.overlay) shot.overlay(); counter(i); subtitle(sc,t); }
window.render=render; window.renderToData=f=>{render(f);return cv.toDataURL('image/jpeg',.92);};
</script></body></html>
