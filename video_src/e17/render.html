<!doctype html>
<html><head><meta charset="utf-8"><title>E17 render（擬人妮妲・扁平插畫）</title>
<style>html,body{margin:0;background:#222}canvas{display:block;width:432px;height:540px}</style>
</head><body>
<canvas id="c"></canvas>
<script src="timeline.js"></script>
<script src="../lib/nita.js"></script>
<script src="../lib/scene.js"></script>
<script>
// E17「認識妮妲」：扁平插畫、4:5、24fps 順暢動作、幕與幕直接硬切、只有西語字幕（2026-10-02 VERA 定案）
const {W,H} = TL;
const cv=document.getElementById('c'); cv.width=W; cv.height=H; const ctx=cv.getContext('2d');
const FONT='"Liberation Sans","DejaVu Sans",sans-serif';
const E01 = x=>x<0?0:x>1?1:x;
const ease = p=>{ p=E01(p); return p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2; };
const pop  = p=>{ p=E01(p); const c=1.7; return 1+(c+1)*Math.pow(p-1,3)+c*Math.pow(p-1,2); };
const lerp = (a,b,p)=>a+(b-a)*p;
const camLerp = (a,b,p)=>[lerp(a[0],b[0],p),lerp(a[1],b[1],p),lerp(a[2],b[2],p)];

// 共用的角色狀態：呼吸、眨眼、講話時嘴巴開合
function base(t, sc, extra={}){
  const st = Object.assign({x:540, y:1180, s:1.0, expr:'aloof', tail:Math.sin(t*2)*0.12, headTilt:Math.sin(t*1.3)*0.02}, extra);
  st.y += Math.sin(t*2.4)*2.5;
  const rest = st.expr;
  if(t>=sc.voice && t<sc.voiceEnd) st.expr = (Math.floor((t-sc.voice)/0.15)%2===0) ? 'talk' : rest;
  else if(((t+sc.idx*0.7)%3.1)<0.12 && rest!=='soft') st.expr='blink';
  return st;
}
const wave = t=>-2.3+Math.sin(t*8)*0.28;   // 手往外上方揮，不要貼在臉頰旁

// 每一幕：回傳 {cam, roomOpts, nita, overlay}
const SHOTS = [
  // 1 Me llamo Nita.：從左邊走進來，停下來揮手
  (t,sc)=>{ const p=ease((t-sc.start)/0.65); const st=base(t,sc,{x:lerp(-180,540,p)});
    if(t>sc.voice-0.15) { st.pose='point'; st.pointAng=wave(t); }
    return {cam:camLerp([1.12,540,760],[1.0,540,700],ease((t-sc.start)/1.2)), nita:st}; },
  // 2 Soy Nita.：鏡頭推近，歪頭
  (t,sc)=>({cam:camLerp([1.45,540,870],[1.6,540,880],ease((t-sc.start)/(sc.end-sc.start))), nita:base(t,sc,{headTilt:0.09*ease((t-sc.start)/0.4)})}),
  // 3 Soy una gatita.：甩尾巴、輕輕跳一下
  (t,sc)=>{ const st=base(t,sc,{tail:Math.sin(t*7)*0.35}); if(t>sc.voice&&t<sc.voiceEnd+0.2) st.y-=Math.abs(Math.sin((t-sc.voice)*5.5))*16; return {cam:[1.15,560,820], nita:st}; },
  // 4 Mi nombre es Nita.：轉頭看木牌、抬手指，木牌亮起來
  (t,sc)=>{ const st=base(t,sc,{x:560,expr:'side',look:1}); if(t>sc.voice-0.25){ st.pose='point'; st.pointAng=lerp(-0.4,-2.15,ease((t-sc.voice+0.25)/0.3)); }
    return {cam:camLerp([1.1,640,800],[1.18,700,790],ease((t-sc.start)/(sc.end-sc.start))), roomOpts:{signGlow:ease((t-sc.voice)/0.4)}, nita:st}; },
  // 5 Me dicen Nita.：兩邊有人喊「¡Nita!」，她左右看
  (t,sc)=>{ const st=base(t,sc,{expr:'side',look: t<sc.start+0.75?-1:1});
    const bubbles=[['¡Nita!',190,430,-0.06,sc.start+0.05],['¡Nita!',880,600,0.06,sc.start+0.6]];
    return {cam:[1.2,540,800], nita:st, overlay:()=>bubbles.forEach(([tx,x,y,r,t0],k)=>{ const s=pop((t-t0)/0.3); if(s<=0) return;
      ctx.save(); ctx.translate(x,y); ctx.rotate(r); ctx.scale(s,s);
      ctx.fillStyle='#FFFDF8'; ctx.beginPath(); ctx.roundRect(-140,-62,280,124,40); ctx.fill();
      ctx.beginPath(); ctx.moveTo(k?-40:40,56); ctx.lineTo(k?-70:70,104); ctx.lineTo(k?0:0,56); ctx.closePath(); ctx.fill();
      ctx.font=`800 60px ${FONT}`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle='#4A3168'; ctx.fillText(tx,0,4); ctx.restore(); })}; },
  // 6 ¡Hola! Me llamo Nita.：正面揮手，小跳
  (t,sc)=>{ const st=base(t,sc,{pose:'point',pointAng:wave(t)}); if(t<sc.voiceEnd) st.y-=Math.abs(Math.sin((t-sc.start)*4.5))*12; return {cam:[1.25,540,830], nita:st}; },
  // 7 Soy una gata pequeña.：大沙發出現，比一比她很小
  (t,sc)=>({cam:camLerp([1.05,560,800],[0.95,620,760],ease((t-sc.start)/(sc.end-sc.start))), roomOpts:{chair:pop((t-sc.start)/0.45)}, nita:base(t,sc,{x:400,y:1190,s:0.75,headTilt:-0.06})}),
  // 8 Mi nombre es Nita y soy una gatita.：指木牌、甩尾巴
  (t,sc)=>{ const st=base(t,sc,{x:560,expr:'side',look:1,tail:Math.sin(t*6)*0.3}); if(t>sc.voice) { st.pose='point'; st.pointAng=lerp(-0.4,-2.15,ease((t-sc.voice)/0.3)); }
    return {cam:[1.12,660,800], roomOpts:{signGlow:ease((t-sc.voice)/0.4)}, nita:st}; },
  // 9 Mucho gusto, soy Nita.：輕輕屈膝打招呼
  (t,sc)=>{ const d=Math.sin(E01((t-sc.voice)/0.9)*Math.PI); const st=base(t,sc,{headTilt:0.1*d}); st.y+=14*d; return {cam:[1.3,540,850], nita:st}; },
  // 10 Este es mi pequeño mundo.：鏡頭拉遠看到整個角落，眼神終於放鬆
  (t,sc)=>{ const st=base(t,sc,{expr:'soft',pose:'point',pointAng:lerp(-0.3,-1.6,ease((t-sc.voice)/0.4))}); return {cam:camLerp([1.45,560,900],[1.0,540,675],ease((t-sc.start)/1.6)), nita:st}; },
];

function subtitle(sc, t){
  if(t<sc.voice-0.1) return;
  ctx.save(); ctx.globalAlpha=E01((t-(sc.voice-0.1))/0.15);
  ctx.font=`800 54px ${FONT}`; ctx.textAlign='left'; ctx.textBaseline='middle';
  const words=sc.es.split(' '), lines=[]; let cur='';
  words.forEach(w=>{ const n=cur?cur+' '+w:w; if(ctx.measureText(n).width>880){ lines.push(cur); cur=w; } else cur=n; }); lines.push(cur);
  const lh=70, h=lines.length*lh+44, y0=H-60-h;
  ctx.fillStyle='rgba(255,253,248,.95)'; ctx.beginPath(); ctx.roundRect(70,y0,W-140,h,32); ctx.fill();
  lines.forEach((ln,k)=>{ const y=y0+22+lh*k+lh/2, wl=ctx.measureText(ln).width, x0=W/2-wl/2;
    const i=ln.indexOf(sc.key);
    if(i>=0){ const pre=ctx.measureText(ln.slice(0,i)).width, kw=ctx.measureText(sc.key).width;
      ctx.fillStyle='rgba(212,169,58,.38)'; ctx.beginPath(); ctx.roundRect(x0+pre-8,y-24,kw+16,50,12); ctx.fill(); }
    ctx.fillStyle='#3B3550'; ctx.fillText(ln,x0,y); });
  ctx.restore();
}
function counter(i){
  ctx.save(); ctx.fillStyle='rgba(255,253,248,.85)'; ctx.beginPath(); ctx.roundRect(40,40,150,62,31); ctx.fill();
  ctx.font=`800 34px ${FONT}`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle='#7A55A8'; ctx.fillText(`${i+1} / 10`,115,72); ctx.restore();
}
function endCard(t){
  const p=t-TL.endCard.start;
  ctx.save(); SCENE.camera(ctx,1,540,675); SCENE.room(ctx); ctx.restore();
  ctx.fillStyle='rgba(246,240,230,.55)'; ctx.fillRect(0,0,W,H);
  const s=pop(p/0.45);
  ctx.save(); ctx.translate(W/2,420); ctx.scale(s,s);
  ctx.fillStyle='#FFFDF8'; ctx.beginPath(); ctx.roundRect(-400,-170,800,340,48); ctx.fill();
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font=`900 104px ${FONT}`; ctx.fillStyle='#4A3168'; ctx.fillText('¡Hasta pronto!',0,-34);
  ctx.font=`800 48px ${FONT}`; ctx.fillStyle='#C9A13E'; ctx.fillText('Mi Pequeña Casa',0,74);
  ctx.restore();
  NITA.draw(ctx,{x:540,y:1250,s:0.95,expr:'soft',pose:'point',pointAng:wave(t),tail:Math.sin(t*3)*0.2});
}
function sceneAt(t){ for(let i=0;i<TL.scenes.length;i++) if(t<TL.scenes[i].end) return i; return TL.endCard.end>TL.endCard.start ? TL.scenes.length : TL.scenes.length-1; }
function render(frame){
  const t=frame/TL.FPS_DRAW, i=sceneAt(t);
  ctx.fillStyle='#F3EADF'; ctx.fillRect(0,0,W,H);
  if(i>=TL.scenes.length){ endCard(t); return; }
  const sc=TL.scenes[i], shot=SHOTS[i](t,sc);
  ctx.save(); SCENE.camera(ctx,...shot.cam); SCENE.room(ctx, shot.roomOpts||{}); NITA.draw(ctx, shot.nita); ctx.restore();
  if(shot.overlay) shot.overlay();
  counter(i); subtitle(sc,t);
}
window.render=render;
window.renderToData=f=>{ render(f); return cv.toDataURL('image/jpeg',.92); };
</script></body></html>
